services:
  usuarios-service:
    build:
      context: ./back-end/Portal.Autenticacao.Api
      dockerfile: Dockerfile
    container_name: usuarios-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5001
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5001:5001"
    networks:
      - portal-b2b-network

  portal-front:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-/api/usuarios}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: portal-front
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - usuarios-service
    networks:
      - portal-b2b-network

networks:
  portal-b2b-network:
    external: true
